<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8E6A"/>
      <stop offset="1" stop-color="#275A42"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0F2A1E" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- Splash mark: rounded, transparent corners. -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <!-- Handle -->
    <path d="M 340 486 A 172 172 0 0 1 684 486" fill="none" stroke="#FAF8F3" stroke-width="58" stroke-linecap="round"/>
    <!-- Rim -->
    <rect x="226" y="452" width="572" height="92" rx="46" fill="#FAF8F3"/>
    <!-- Body -->
    <path d="M 284 520 L 740 520 L 694 786 Q 688 822 652 822 L 372 822 Q 336 822 330 786 Z" fill="#FAF8F3"/>
  </g>
  <!-- Slats -->
  <g stroke="#3B7A58" stroke-width="34" stroke-linecap="round">
    <line x1="414" y1="602" x2="426" y2="742"/>
    <line x1="512" y1="602" x2="512" y2="742"/>
    <line x1="610" y1="602" x2="598" y2="742"/>
  </g>
  <!-- "Psst!" reminder dot -->
  <circle cx="768" cy="268" r="92" fill="#F3B544"/>
  <circle cx="768" cy="268" r="92" fill="none" stroke="#FAF8F3" stroke-width="22"/>
</svg>
